<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VActives Real Photo Shortlist</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px;background:#f7f4ec;font-family:Arial,sans-serif;color:#12372f}
    h1{margin:0 0 28px;font-size:36px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    figure{margin:0;background:white;border-radius:20px;overflow:hidden;border:1px solid #e7dfd0}
    img{display:block;width:100%;height:270px;object-fit:cover}figcaption{padding:14px 16px;font-weight:700}
  </style>
</head>
<body>
  <h1>VActives — real photography shortlist</h1>
  <div class="grid">
    <figure><img src="https://images.unsplash.com/photo-1522071901873-411886a10004?auto=format&fit=crop&w=1000&q=85"><figcaption>Hero — team collaboration</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1698047681432-006d2449c631?auto=format&fit=crop&w=1000&q=85"><figcaption>Recruitment — reviewing candidates</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1568992687947-868a62a9f521?auto=format&fit=crop&w=1000&q=85"><figcaption>Beyond hire — onboarding support</figcaption></figure>
    <figure><img src="https://images.pexels.com/photos/7504886/pexels-photo-7504886.jpeg?auto=compress&cs=tinysrgb&h=627&fit=crop&w=1200"><figcaption>Cold Caller / Appointment Setter</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1551434678-e076c223a692?auto=format&fit=crop&w=1000&q=85"><figcaption>Lead Manager / CRM Manager</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1507206130118-b5907f817163?auto=format&fit=crop&w=1000&q=85"><figcaption>Executive Assistant</figcaption></figure>
  </div>
</body>
</html>
